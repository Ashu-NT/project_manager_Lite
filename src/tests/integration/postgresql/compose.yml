name: project-manager-r5h1

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: project_manager_r5h
      POSTGRES_USER: r5h_admin
      POSTGRES_PASSWORD: r5h_admin_test_only
    ports:
      - "${PM_R5H1_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U r5h_admin -d project_manager_r5h"]
      interval: 2s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./bootstrap:/docker-entrypoint-initdb.d:ro

